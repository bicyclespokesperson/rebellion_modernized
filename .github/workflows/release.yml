# Release binaries for Linux (x86-64), macOS (arm64, macOS 26 and later) and Windows (x86-64), run by hand from the Actions tab.
# A draft GitHub Release for the given tag is created first; each platform builds the `rebellion` target in Release with the
# native configuration and uploads its archive to that release; the release is published once every platform has uploaded.
# No game data is included: startup text is read directly from the player's own REBEXE.EXE at runtime, so the archives
# contain only the executable and the Liberation Sans fallback fonts. On first launch the app prompts the user to select
# their Star Wars: Rebellion installation folder (or reads install_dir from config.ini).
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag for the new release, for example v0.2.0 (created at the commit being run)
        required: true
        type: string

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cat <<'EOF' > release-notes.md
          Native builds for Linux (x86-64), macOS (Apple Silicon, macOS 26+), and Windows (x86-64).

          ### How to run
          You need your own copy of the original 1998 *Star Wars: Rebellion* (Steam, GOG, or CD).

          1. Download and extract the archive for your platform:
             - **macOS (arm64, macOS 26+):** unzip `rebellion-macos-arm64.zip` and open `Rebellion.app`. Because the build is ad-hoc signed (not notarized), allow it in **System Settings → Privacy & Security → Open Anyway**, or run `xattr -dr com.apple.quarantine Rebellion.app`.
             - **Windows (x86-64):** unzip `rebellion-windows-x86_64.zip` and run `rebellion.exe`.
             - **Linux (x86-64):** extract `rebellion-linux-x86_64.tar.gz` and run `./rebellion`.
          2. On first launch, click **Choose Game Folder...** and select your *Star Wars: Rebellion* installation folder (the folder containing `REBEXE.EXE`, `GData`, `EData`, `MDATA`, and the game `.DLL` files). The path is saved automatically to `config.ini`.

          You can also configure `install_dir` manually in `config.ini`:
          - **macOS:** `~/Library/Application Support/Rebellion/config.ini`
          - **Windows:** `%APPDATA%\Rebellion\config.ini`
          - **Linux:** `~/.config/rebellion/config.ini`
          EOF
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md

  linux:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libasound2-dev libpulse-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libegl1-mesa-dev libudev-dev libdbus-1-dev libxcb1-dev libxtst-dev libxrender-dev
      - name: Dependencies
        run: tools/fetch_deps.sh freetype liberation sdl3
      - name: Configure
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_BUILD_TYPE=Release -DREB_NATIVE=ON
      - name: Build
        run: cmake --build build/native --target rebellion
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          stage=dist/rebellion-linux-x86_64
          mkdir -p "$stage/fonts"
          cp build/native/rebellion "$stage/"
          cp third_party/liberation-fonts-ttf-2.1.5/LiberationSans-Regular.ttf third_party/liberation-fonts-ttf-2.1.5/LiberationSans-Bold.ttf "$stage/fonts/"
          tar -C dist -czf "$stage.tar.gz" "$(basename "$stage")"
          gh release upload "$TAG" "$stage.tar.gz" --clobber

  macos:
    needs: create-release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install cmake ninja uv coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Dependencies
        run: tools/fetch_deps.sh freetype liberation sdl3
      - name: Configure
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DREB_NATIVE=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build
        run: cmake --build build/native --target rebellion
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          archive="dist/rebellion-macos-arm64.zip"
          ditto -c -k --keepParent build/native/Rebellion.app "$archive"
          gh release upload "$TAG" "$archive" --clobber

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: LLVM
        shell: pwsh
        run: |
          choco upgrade llvm -y --no-progress
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version
      - name: Dependencies
        shell: bash
        run: bash tools/fetch_deps.sh freetype liberation sdl3
      - name: Configure
        run: >-
          cmake -S . -B build/native -G Ninja
          -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe"
          -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe"
          -DCMAKE_BUILD_TYPE=Release -DREB_NATIVE=ON
      - name: Build
        run: cmake --build build/native --target rebellion
      - name: Package and upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $stage = "dist/rebellion-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$stage/fonts" | Out-Null
          Copy-Item build/native/rebellion.exe $stage
          Copy-Item third_party/liberation-fonts-ttf-2.1.5/LiberationSans-Regular.ttf, third_party/liberation-fonts-ttf-2.1.5/LiberationSans-Bold.ttf "$stage/fonts"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          gh release upload $env:TAG "$stage.zip" --clobber

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
