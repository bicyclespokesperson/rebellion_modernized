# Release binaries for Linux (x86-64), macOS (arm64 and x86-64) and Windows (x86-64), run by hand from the Actions tab.
# A draft GitHub Release for the given tag is created first; each platform builds the `rebellion` target in Release with the
# native configuration and uploads its archive to that release; the release is published once every platform has uploaded.
# No game data is used: the startup text pack and the macOS icon come from a local installation and are absent here, so
# the archives contain only the executable and the Liberation Sans fallback fonts. Players still need their own copy of the
# game; the first-run check asks for it through config.ini (install_dir).
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag for the new release, for example v0.2.0 (created at the commit being run)
        required: true
        type: string

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Native builds for Linux, macOS and Windows. Requires your own copy of Star Wars: Rebellion (set install_dir in config.ini)."

  linux:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libasound2-dev libpulse-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libegl1-mesa-dev libudev-dev libdbus-1-dev libxcb1-dev libxtst-dev libxrender-dev
      - name: Dependencies
        run: tools/fetch_deps.sh freetype liberation sdl3
      - name: Configure
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 \
            -DCMAKE_BUILD_TYPE=Release -DREB_NATIVE=ON
      - name: Build
        run: cmake --build build/native --target rebellion
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          stage=dist/rebellion-linux-x86_64
          mkdir -p "$stage/fonts"
          cp build/native/rebellion "$stage/"
          cp third_party/liberation-fonts-ttf-2.1.5/LiberationSans-Regular.ttf third_party/liberation-fonts-ttf-2.1.5/LiberationSans-Bold.ttf "$stage/fonts/"
          tar -C dist -czf "$stage.tar.gz" "$(basename "$stage")"
          gh release upload "$TAG" "$stage.tar.gz" --clobber

  macos:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-14, arch: arm64}
          - {runner: macos-15-intel, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install cmake ninja uv coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Dependencies
        run: tools/fetch_deps.sh freetype liberation sdl3
      - name: Configure
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DREB_NATIVE=ON \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
      - name: Build
        run: cmake --build build/native --target rebellion
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          archive="dist/rebellion-macos-${{ matrix.arch }}.zip"
          ditto -c -k --keepParent build/native/Rebellion.app "$archive"
          gh release upload "$TAG" "$archive" --clobber

  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: LLVM
        shell: pwsh
        run: |
          choco upgrade llvm -y --no-progress
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version
      - name: Dependencies
        shell: bash
        run: bash tools/fetch_deps.sh freetype liberation sdl3
      - name: Configure
        run: >-
          cmake -S . -B build/native -G Ninja
          -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe"
          -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe"
          -DCMAKE_BUILD_TYPE=Release -DREB_NATIVE=ON
      - name: Build
        run: cmake --build build/native --target rebellion
      - name: Package and upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $stage = "dist/rebellion-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$stage/fonts" | Out-Null
          Copy-Item build/native/rebellion.exe $stage
          Copy-Item third_party/liberation-fonts-ttf-2.1.5/LiberationSans-Regular.ttf, third_party/liberation-fonts-ttf-2.1.5/LiberationSans-Bold.ttf "$stage/fonts"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          gh release upload $env:TAG "$stage.zip" --clobber

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
