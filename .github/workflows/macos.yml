# Native macOS build, arm64 and x86-64 (run by hand from the Actions tab: macOS runner minutes are billed at 10x on private repos): the same cmake/native.cmake as Linux, with the OS differences in
# cmake/native_platform.cmake and src/port/native/platform_macos.cpp (docs/native.md). Compiles every object of the native
# configuration (game, port layer, SDL3 with its Cocoa/Metal backends, FreeType) and runs the unit tests that need no game data
# (MW_INSTALL_DIR unset: the tests that read the installation skip themselves). No game data in CI: linking needs REBEXE.EXE
# (startup artwork, tools/extract_startup_assets.py), so the executable and Rebellion.app are built on a developer's Mac.
# Runners: macos-14 is Apple silicon; macos-13 (the Intel runner) was retired by GitHub in December 2025, macos-15-intel replaces it.
name: macos
on: workflow_dispatch

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-14, arch: arm64}
          - {runner: macos-15-intel, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install cmake ninja uv
      - name: Dependencies
        run: tools/fetch_deps.sh freetype liberation sdl3
      - name: Configure
        run: cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DREB_NATIVE=ON -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
      - name: Build objects
        run: cmake --build build/native --target reb_native_objects
      - name: Object cast regression checks
        if: matrix.arch == 'arm64'
        run: |
          uv run tools/test_audit_object_casts.py
          uv run tools/audit_object_casts.py --build build/native --check
      - name: Unit tests
        # Not yet verified on a Mac (some golden tests may depend on the fonts present): once green, remove continue-on-error.
        continue-on-error: true
        run: |
          cmake -S src/port/minwin_impl -B build/minwin_impl -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build build/minwin_impl
          (cd build/minwin_impl && ctest --output-on-failure)
